services:
  api:
    build: .
    container_name: project_management_api

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg2://admin:admin@db:5432/project_management


    depends_on:
      - db

    volumes:
      - ./uploads:/app/uploads

  db:
    image: postgres:17

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: project_management

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: