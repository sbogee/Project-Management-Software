<!DOCTYPE html>
<html>
    <script src="/static/projects.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <head>
        <title>Project Management - Projects</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        >
    </head>
    <body class="bg-light">
        <div class="container mt-4">
            <div class="d-flex justify-content-between">
                <h2>Projects</h2>
                <button
                    class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#createProjectModal"
                >
                    Create Project
                </button>
                <button
                    class="btn btn-outline-danger"
                    onclick="logout()"
                >
                    Logout
                </button>
            </div>
            <hr>
            <div id="projects">
                <h3 id="ownedProjectsTitle">Owned Projects</h3>
                <div id="ownedProjects"></div>
                <hr id="separator">
                <h3 id="participantProjectsTitle">Shared With Me</h3>
                <div id="participantProjects"></div>
            </div>
        </div>
        {% include "components/create_project_modal.html" %}
    </body>
</html>
