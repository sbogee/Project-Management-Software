<div
    class="modal fade"
    id="editProjectModal"
    tabindex="-1"
>
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    Modify Project
                </h5>
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">
                        Name
                    </label>
                    <input
                        type="text"
                        id="editProjectName"
                        class="form-control"
                    >
                </div>
                <div class="mb-3">
                    <label class="form-label">
                        Description
                    </label>
                    <textarea
                        id="editProjectDescription"
                        class="form-control"
                    ></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Cancel
                </button>
                <button
                    class="btn btn-primary"
                    onclick="updateProject()"
                >
                    Save
                </button>
            </div>
        </div>
    </div>
</div>
