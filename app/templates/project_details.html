<!DOCTYPE html>
<html>
    <head>
        <title>Project Details</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        >
    </head>
    <body class="bg-light" data-project-id="{{ project_id }}">
        <div class="container mt-4">
            <a href="/projects-page"
            class="btn btn-secondary mb-3">
            Back
            </a>
            <div id="projectDetails">
                <h2 id="projectName"></h2>
                <p id="projectDescription"></p>
                <div class="mb-3">
                    <button
                        class="btn btn-warning"
                        data-bs-toggle="modal"
                        data-bs-target="#editProjectModal"
                    >
                        Modify Project
                    </button>
                </div>
            </div>
            <hr>
            <h4>Owner</h4>
            <p id="owner"></p>
            <hr>
            <h4 id="membersTitle">Members</h4>
            <ul id="memberList"></ul>
            <hr id="separator">
            <div id="documents">
                <h4 id="documentsTitle">Documents</h4>
                <ul id="documentList"></ul>
                <div class="mb-3">
                    <button
                        class="btn btn-warning"
                        data-bs-toggle="modal"
                        data-bs-target="#uploadDocumentModal"
                    >
                        Upload Document
                    </button>
                </div>
            </div>
            <div class="text-end">
                <button
                    class="btn btn-danger"
                    onclick="deleteProject()"
                >
                    Delete Project
                </button>
            </div>
        </div>
    {% include "components/edit_project_modal.html" %}
    {% include "components/upload_document_modal.html" %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/project_details.js"></script>
    </body>
</html>
